<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunch: test your theory of why a post appears</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bar"><div class="bar-in"><span class="logo" aria-hidden="true"></span><strong>Hunch</strong><span class="bar-note">Simulated feed</span></div></div>
  <div class="wrap">
    <header>
      <h1>Why is this in my feed?</h1>
      <p>Pick a post and say why you think it is there. Hunch tests your theory by switching that signal off and re-ranking the feed.</p>
      <p class="note">This is a simulated feed with five invented signals. Nothing here comes from a real platform.</p>
    </header>
    <main id="feed"><p class="status">Loading your feed…</p></main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
